<!doctype html><html><head><base target="_blank"><title>AI Literacy Scale | Impact Network</title><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;padding:26px;font-family:Arial,sans-serif;color:#263d36;background:#f8f9f7}header{display:flex;justify-content:space-between;gap:20px}.eyebrow{font-size:10px;letter-spacing:2px;color:#73837b}h1{font:normal 36px Georgia;margin:12px 0 6px}p{font-size:13px;line-height:1.6;color:#627269}svg{width:100%;height:auto;display:block}.legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;font-size:11px;color:#627269}#detail{border-top:1px solid #dbe2dc;margin-top:20px;padding-top:18px;min-height:110px}a{color:#356b80}button{border:1px solid #ccd5ce;border-radius:20px;padding:7px 12px;background:transparent;color:inherit;cursor:pointer}button.active{background:#263d36;color:white}.filters{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}#error{color:#a33} @media(max-width:500px){body{padding:14px}h1{font-size:28px}}
</style></head><body><header><div><div class="eyebrow">AI LITERACY SCALE · 2025—PRESENT</div><h1>Research in motion.</h1><p>From doctoral research to international reach.</p></div></header><div class="filters" id="filters"></div><div id="error" role="alert"></div><svg id="graph" role="img" aria-label="Interactive research impact network"></svg><div class="legend"><span>● Original research</span><span style="color:#5279a5">● Scholarly</span><span style="color:#468a79">● Education &amp; Policy</span><span style="color:#a68a54">○ International</span><span>┄ Requests / sharing</span><span>◎ Direct scale use</span></div><section id="detail" aria-live="polite"><div class="eyebrow">EXPLORE THE CONNECTIONS</div><p>Select a node to view its details and source.</p></section><script>
const C={original:'#526b75',scholarly:'#5279a5',educational:'#468a79',international:'#a68a54'};let records=[],filter='all',simulation;
const svg=d3.select('#graph');const pending=n=>['Requested','Shared','Inquiry','In progress'].includes(n.status);
function details(n){const d=document.getElementById('detail');d.replaceChildren();for(const [tag,val] of [['div',n.category.toUpperCase()+' / '+n.status],['h2',n.label],['p',n.description],['p',[n.country,n.year,n.field,n.relation].filter(Boolean).join(' · ')]]){let e=document.createElement(tag);e.textContent=val;if(tag==='div')e.className='eyebrow';d.append(e)}if(/^https:\/\//i.test(n.url||'')){let a=document.createElement('a');a.href=n.url;a.rel='noopener noreferrer';a.textContent='View source ↗';d.append(a)}}
function draw(){if(simulation)simulation.stop();svg.selectAll('*').remove();const seen=new Set();let nodes=records.filter(n=>n.id&&!seen.has(n.id)&&seen.add(n.id)&&(filter==='all'||n.category==='original'||n.category===filter)).map(n=>({...n}));let ids=new Set(nodes.map(n=>n.id));let links=nodes.flatMap(n=>(n.parents||'').split(';').map(s=>s.trim()).filter(s=>ids.has(s)&&s!==n.id).map(s=>({source:s,target:n.id,pending:pending(n)})));let w=800,h=Math.max(530,Math.ceil(nodes.length/6)*185),cx=w/2,cy=h*.44;svg.attr('viewBox',`0 0 ${w} ${h}`);let centers={original:[cx,cy],scholarly:[175,h*.23],educational:[635,h*.25],international:[400,h*.81]};let defs=svg.append('defs');Object.entries(C).forEach(([k,c])=>{let g=defs.append('radialGradient').attr('id','glow-'+k);g.append('stop').attr('stop-color',c).attr('stop-opacity',.13);g.append('stop').attr('offset','100%').attr('stop-color',c).attr('stop-opacity',0)});Object.entries(centers).filter(([k])=>k!=='original'&&(filter==='all'||filter===k)).forEach(([k,[x,y]])=>svg.append('ellipse').attr('cx',x).attr('cy',y).attr('rx',155).attr('ry',110).attr('fill',`url(#glow-${k})`));let g=svg.append('g');let lines=g.append('g').selectAll('line').data(links).join('line').attr('stroke','#859a90').attr('stroke-width',1.25).attr('stroke-opacity',.6).attr('stroke-dasharray',l=>l.pending?'4 5':null);let radius=n=>n.id==='scale'?44:n.category==='original'?23:13;let group=g.append('g').selectAll('g').data(nodes).join('g').attr('tabindex',0).attr('role','button').attr('aria-label',n=>n.label).style('cursor','pointer').on('click',(e,n)=>details(n)).on('keydown',(e,n)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();details(n)}});group.append('circle').attr('r',n=>radius(n)+8).attr('fill',n=>C[n.category]||C.original).attr('opacity',.09);group.append('circle').attr('r',radius).attr('fill',n=>pending(n)?'#f8f9f7':n.id==='scale'?'#29443d':C[n.category]||C.original).attr('stroke',n=>C[n.category]||C.original).attr('stroke-width',1.5);group.filter(n=>n.relation==='Scale use').append('circle').attr('r',n=>radius(n)-4).attr('stroke','white').attr('stroke-width',1.3).attr('fill','none');group.each(function(n){let t=d3.select(this).append('text').attr('text-anchor','middle').attr('font-size',n.id==='scale'?14:12).attr('fill',n.id==='scale'?'white':'#263d36').attr('y',n.id==='scale'?-5:radius(n)+17);let words=n.label.split(' '),lines=[],s='';for(let word of words){if(s.length+word.length>23&&s){lines.push(s);s=word}else s+=(s?' ':'')+word}if(s)lines.push(s);if(n.id==='scale')lines=['AI Literacy','Scale'];lines.forEach((l,i)=>t.append('tspan').attr('x',0).attr('dy',i?15:0).text(l))});nodes.forEach((n,i)=>{let c=centers[n.category]||centers.original;n.x=c[0]+Math.cos(i*2.4)*55;n.y=c[1]+Math.sin(i*2.4)*45;if(n.id==='scale'){n.fx=cx;n.fy=cy}if(n.id==='thesis'){n.fx=cx-125;n.fy=cy-60}if(n.id==='article'){n.fx=cx+125;n.fy=cy-60}});simulation=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(n=>n.id).distance(112).strength(.25)).force('charge',d3.forceManyBody().strength(-180)).force('collision',d3.forceCollide(n=>n.id==='scale'?62:56)).force('x',d3.forceX(n=>(centers[n.category]||centers.original)[0]).strength(.18)).force('y',d3.forceY(n=>(centers[n.category]||centers.original)[1]).strength(.2)).on('tick',()=>{nodes.forEach(n=>{n.x=Math.max(85,Math.min(w-85,n.x));n.y=Math.max(40,Math.min(h-65,n.y))});lines.attr('x1',l=>l.source.x).attr('y1',l=>l.source.y).attr('x2',l=>l.target.x).attr('y2',l=>l.target.y);group.attr('transform',n=>`translate(${n.x},${n.y})`)});group.call(d3.drag().on('start',(e,n)=>{if(!e.active)simulation.alphaTarget(.2).restart();n.fx=n.x;n.fy=n.y}).on('drag',(e,n)=>{n.fx=e.x;n.fy=e.y}).on('end',(e,n)=>{if(!e.active)simulation.alphaTarget(0);if(!['scale','thesis','article'].includes(n.id)){n.fx=null;n.fy=null}}))}
function init(data){records=data;document.getElementById('filters').replaceChildren();for(const [key,label] of [['all','All connections'],['scholarly','Scholarly'],['educational','Education & Policy'],['international','International']]){let b=document.createElement('button');b.textContent=label;b.className=key===filter?'active':'';b.onclick=()=>{filter=key;init(records)};document.getElementById('filters').append(b)}draw()}
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTm07V2aI5LGjUc-6dph1xJIiwOmfJkoy9YfxxGJW3JxG9RPx4mIIUk_0sUH3Mgj14G789Jwy_Y1_4F/pub?gid=1110470298&single=true&output=csv';
const snapshot = [{"id": "scale", "label": "AI Literacy Scale", "category": "original", "parents": "", "status": "Research project", "description": "Research programme spanning the doctoral instrument and published 17-item version.", "url": "https://sites.google.com/yonsei.ac.kr/ai-literacy-scale/ai-literacy-scale", "country": "South Korea", "year": "2025–", "field": "AI literacy", "relation": "Research programme"}, {"id": "thesis", "label": "Kang (2025)", "category": "original", "parents": "scale", "status": "Doctoral dissertation", "description": "대학생과 대학원생을 위한 AI 리터러시 측정도구 개발 / A study on the development of AI literacy scale: focusing on undergraduate and graduate students. Yonsei University, February 2025.", "url": "https://www.riss.kr/link?id=T17157753", "country": "South Korea", "year": "2025", "field": "LIS", "relation": "Original research"}, {"id": "article", "label": "Kang & Park (2026)", "category": "original", "parents": "scale", "status": "Journal article", "description": "Development and validation of a multidimensional AI literacy scale for higher education students: A mixed-method study. Journal of Librarianship and Information Science. Four dimensions, 17 items.", "url": "https://doi.org/10.1177/09610006261425235", "country": "South Korea", "year": "2026", "field": "LIS", "relation": "Original research"}, {"id": "jeong", "label": "Jeong (2025)", "category": "scholarly", "parents": "thesis", "status": "Published", "description": "대학도서관 사서의 AI 리터러시 평가 루브릭 개발과 적용. Cites the dissertation in librarian assessment rubric development.", "url": "https://doi.org/10.16981/kliss.56.4.202512.277", "country": "South Korea", "year": "2025", "field": "LIS", "relation": "Citation"}, {"id": "oh", "label": "Oh & Lee (2025)", "category": "scholarly", "parents": "thesis", "status": "Published", "description": "대학생의 AI 활용역량이 학습전략 및 자기주도학습능력에 미치는 영향. Dissertation appears in references; direct instrument use not established.", "url": "https://doi.org/10.62783/SHSS.7.6.45", "country": "South Korea", "year": "2025", "field": "Higher education", "relation": "Citation"}, {"id": "lee", "label": "Lee et al. (2025)", "category": "scholarly", "parents": "thesis", "status": "Published", "description": "대학 교수자의 생성형 AI 활용을 위한 AI-TPACK 기반 수업설계 연구. Dissertation cited in instructional design research.", "url": "https://doi.org/10.22804/jke.2025.52.2.009", "country": "South Korea", "year": "2025", "field": "Instructional design", "relation": "Citation"}, {"id": "koo", "label": "Koo et al. (2026)", "category": "scholarly", "parents": "thesis", "status": "Published", "description": "대학생 PSC 핵심역량 진단도구 개발 연구 - B대학 사례를 중심으로 -. Cites the dissertation in competency instrument development.", "url": "https://doi.org/10.22957/mses.22..202603.1", "country": "South Korea", "year": "2026", "field": "Higher education", "relation": "Citation"}, {"id": "nursing", "label": "Jeong et al. (2026)", "category": "scholarly", "parents": "thesis", "status": "Published", "description": "Artificial Intelligence Literacy, Critical Thinking Disposition, and Clinical Competence Among Nursing Students: A Cross-Sectional Study. Reported use of doctoral 19-item instrument; N=200.", "url": "https://doi.org/10.3390/nursrep16080281", "country": "South Korea", "year": "2026", "field": "Nursing", "relation": "Scale use"}, {"id": "seo", "label": "Seo et al. (2026)", "category": "scholarly", "parents": "thesis", "status": "Published", "description": "학업적 자기효능감이 AI 의존에 미치는 영향: 학업적 완벽주의와 AI 리터러시에 의해 조절된 부정적 정서의 매개효과. Reported use of doctoral 19-item instrument; N=146.", "url": "https://doi.org/10.5762/KAIS.2026.27.4.252", "country": "South Korea", "year": "2026", "field": "Psychology", "relation": "Scale use"}, {"id": "nrc", "label": "NRC / KDI (2025)", "category": "educational", "parents": "thesis", "status": "Published", "description": "이영준, 모두를 위한 AI 리터러시: 기술 중심 AI 교육을 넘어 인간 중심의 리터러시 교육으로. Global Issue Brief 28. Policy discussion reference; not evidence of formal adoption.", "url": "https://www.nrc.re.kr/board.es?act=view&bid=0008&list_no=179749&mid=a12201000000&otp_id=", "country": "South Korea", "year": "2025", "field": "Education policy", "relation": "Policy reference"}, {"id": "frontiers", "label": "Kaya & Meylani (2026)", "category": "scholarly", "parents": "article", "status": "Published", "description": "AI literacy for self-regulated learning among pre-service teachers. Frontiers in Psychology. References the published scale in subsequent instrument development.", "url": "https://doi.org/10.3389/fpsyg.2026.1948694", "country": "Türkiye", "year": "2026", "field": "Educational psychology", "relation": "Citation"}, {"id": "csu", "label": "Cleveland State University", "category": "educational", "parents": "article", "status": "Published", "description": "Using AI in Academics, chapter 5. Discusses the four dimensions in student learning outcomes; not confirmed institutional adoption.", "url": "https://pressbooks.ulib.csuohio.edu/usingaiinacademics/part/5-ai-in-student-learning/", "country": "United States", "year": "2026", "field": "Higher education", "relation": "Educational reference"}];
async function load(){
 const error=document.getElementById('error');
 try {
 if(!CSV_URL.startsWith('https://')){init(snapshot);error.textContent='Preview — live data not configured.';return;}
 const u=new URL(CSV_URL);u.searchParams.set('_',Date.now());
 const response=await fetch(u,{cache:'no-store',credentials:'omit'});if(!response.ok)throw Error('HTTP '+response.status);
 const data=d3.csvParse(await response.text());
 if(!['id','label','category','parents','status','description','url','country','year','field','relation'].every(k=>data.columns.includes(k)))throw Error('Unexpected CSV columns');
 const clean=data.filter(r=>r.id && r.label && ['original','scholarly','educational','international'].includes(r.category));
 if(!clean.some(r=>r.id==='scale'))throw Error('Missing scale');
 init(clean);error.textContent='';
 }catch(e){init(snapshot);error.textContent='Live data unavailable — showing the bundled November 2026 snapshot.';}
}
load();</script></body></html>
